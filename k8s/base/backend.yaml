apiVersion: v1
kind: ConfigMap
metadata:
  name: flowcom-backend-config
  labels:
    app: flowcom
    component: backend
data:
  NODE_ENV: production
  PORT: "3000"
  MONGO_URL: mongodb://mongo:27017/flowcom
  CLIENT_ORIGIN: http://localhost:8080
  APP_URL: http://localhost:8080
  LOG_LEVEL: info
  XAI_BASE: https://api.groq.com/openai/v1
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
---
# Secrets à ne JAMAIS committer. En production, remplacer par un SecretManager,
# un ExternalSecret ou `kubectl create secret generic` :
#
#   kubectl create secret generic flowcom-backend-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=XAI_API_KEY="..." \
#     --from-literal=SMTP_USER="..." \
#     --from-literal=SMTP_PASS="..." \
#     --from-literal=ADMIN_EMAIL="..." \
#     --from-literal=ADMIN_PASSWORD="..."
apiVersion: v1
kind: Secret
metadata:
  name: flowcom-backend-secrets
  labels:
    app: flowcom
    component: backend
type: Opaque
stringData:
  JWT_SECRET: ""
  XAI_API_KEY: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowcom-backend
  labels:
    app: flowcom
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowcom
      component: backend
  template:
    metadata:
      labels:
        app: flowcom
        component: backend
    spec:
      containers:
        - name: backend
          image: flowcom-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: flowcom-backend-config
            - secretRef:
                name: flowcom-backend-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: flowcom-backend
  labels:
    app: flowcom
    component: backend
spec:
  type: ClusterIP
  selector:
    app: flowcom
    component: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flowcom-backend
  labels:
    app: flowcom
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: flowcom
      component: backend
