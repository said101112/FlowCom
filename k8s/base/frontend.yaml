apiVersion: v1
kind: ConfigMap
metadata:
  name: flowcom-frontend-config
  labels:
    app: flowcom
    component: frontend
data:
  API_URL: http://localhost:8080/auth
  SOCKET_URL: http://localhost:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowcom-frontend
  labels:
    app: flowcom
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowcom
      component: frontend
  template:
    metadata:
      labels:
        app: flowcom
        component: frontend
    spec:
      containers:
        - name: frontend
          image: flowcom-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: flowcom-frontend-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: flowcom-frontend
  labels:
    app: flowcom
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: flowcom
    component: frontend
  ports:
    - name: http
      port: 4000
      targetPort: http
